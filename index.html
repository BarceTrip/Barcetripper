<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barcellona">
<meta name="theme-color" content="#07090D">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>Barcellona</title>
</head>
<body>
<div class="bgfx"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="wrap">
  <header class="hd">
    <div class="g hd-cap">
      <div class="hd-t"><b id="hdb"></b><span id="daytag"></span></div>
      <button class="g round" id="bMenu" aria-label="Impostazioni"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div class="route" id="route"></div>
    <div class="g tabs" role="tablist"><span class="ind" id="ind"></span>
      <button id="tabStep" role="tab" aria-selected="true">Tappa</button>
      <button id="tabMap" role="tab" aria-selected="false">Mappa</button>
      <button id="tabSpese" role="tab" aria-selected="false">Spese</button>
    </div>
  </header>

  <section class="view on" id="viewStep"></section>
  <section class="view" id="viewMap"><div class="map" id="map">
    <div id="walker"><div class="fig"><svg viewBox="0 0 34 44" fill="none" aria-hidden="true"><circle cx="13" cy="7.5" r="5.6" fill="#FFCD3C"/><path d="M7.6 15.5h10.2l2.4 11.4h-3.3L15.7 41h-3.1l-1.1-9.6L10.4 41H7.3l1.1-14.1H5.2z" fill="#FFCD3C"/><rect x="22.5" y="24" width="9.5" height="12.5" rx="2" fill="#2ED3C0"/><path d="M27.2 24v-5.4a1.6 1.6 0 0 0-1.6-1.6h-2.4" stroke="#2ED3C0" stroke-width="2" stroke-linecap="round"/><path d="M17.8 18.2l4.9 2.6" stroke="#FFCD3C" stroke-width="2.6" stroke-linecap="round"/></svg></div></div>
  </div></section>
  <section class="view" id="viewSpese"></section>
</div>

<div class="dock"><div class="g dock-in">
  <button class="g round sos" id="bSos" aria-label="Emergenza"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></button>
  <button class="g round back" id="back" aria-label="Indietro"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="g pill tint next" id="next">Fatto, avanti</button>
</div></div>

<button class="g radar idle" id="bRadar" aria-label="Radar posizione"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5" opacity=".55"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><path class="sweep" d="M12 12V3" stroke-width="2.3"/></svg><span class="st"></span></button>
<span class="g rbadge" id="rBadge"></span>
<div class="g rpanel" id="rPanel"></div>
<div class="scrim" id="scrim"></div>
<div class="g sheet" id="sheet"><div class="sheet-in">
  <div class="grab"></div>
  <h2>Impostazioni</h2>
  <button class="g srow" id="sNow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div class="st">Vai all'ora attuale<small>Salta alla tappa giusta per adesso</small></div></button>
  <button class="g srow" id="sNotif"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><div class="st">Avvisi 30 minuti prima<small id="notifSub">Non attivi</small></div><span class="sw" id="swNotif"></span></button>
  <button class="g srow" id="sIcs"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><div class="st">Salva nel calendario<small>22 eventi con avviso, funziona ad app chiusa</small></div></button>
  <button class="g srow" id="sSnd"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><div class="st">Suoni</div><span class="sw on" id="swSnd"></span></button>
  <button class="g srow" id="sMus"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><div class="st">Rumba catalana<small>Parte al primo tocco sullo schermo</small></div><span class="sw on" id="swMus"></span></button>
  <button class="g srow" id="sTheme"><svg class="ic" id="icoTheme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><div class="st">Tema chiaro</div><span class="sw" id="swTheme"></span></button>
</div></div>

<div class="ov" id="sos"><div class="ov-in" id="sosIn"></div></div>
<div class="bigtxt" id="bigtxt"></div>
<div class="g toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script type="module" src="/src/main.js"></script>
</body>
</html>
